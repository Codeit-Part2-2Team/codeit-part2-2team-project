# Grid Search — 모델 아키텍처 비교 중심
#
# 목적: backbone 후보를 lr 2가지와 조합해 빠르게 스크리닝
# 조합 수: 3 × 2 × 2 = 12
# 예상 시간: trial당 약 15분 × 12 = 약 3시간
# 상위 backbone 결정 후 optuna_lr_focused.yaml 로 세밀 탐색 권장

model:
  name:
    - resnet50
    - efficientnet_b2
    - efficientnetv2_s

train:
  lr0:
    - 0.00003
    - 0.0001

  label_smoothing:
    - 0.0
    - 0.05
