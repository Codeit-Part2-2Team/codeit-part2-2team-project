# Optuna — 학습률 집중 탐색
#
# 목적: backbone을 고정한 뒤 lr / lrf / weight_decay 를 세밀하게 탐색
# 권장 trial 수: 30~50
# 사용 예: grid_model_arch.yaml 로 backbone 결정 후 이 파일로 lr 최적화

train:
  lr0:
    type: float
    low: 0.000005
    high: 0.001
    log: true

  lrf:
    type: float
    low: 0.001
    high: 0.1
    log: true

  weight_decay:
    type: float
    low: 0.00005
    high: 0.05
    log: true

  label_smoothing:
    type: float
    low: 0.0
    high: 0.2
